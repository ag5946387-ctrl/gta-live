<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Overlay GPS - estilo GTA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{
    margin:0; padding:0; background:transparent;
    width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #wrap{
    position:relative;
    width:340px; height:340px;
    margin:20px;
  }
  #ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:5px solid #000;
    box-shadow:
      0 0 0 2px rgba(255,255,255,.5),
      0 10px 30px rgba(0,0,0,.6);
    pointer-events:none;
    z-index:20;
  }
  #clip{
    position:absolute; inset:5px;
    border-radius:50%;
    overflow:hidden;
    background:#0a0f14;
  }
  #mapRotor{
    position:absolute;
    /* oversized so rotation never shows empty corners */
    width:200%; height:200%;
    left:-50%; top:-50%;
    transform-origin:50% 50%;
  }
  #map{ width:100%; height:100%; }
  /* tiles libres de OpenStreetMap vienen claros; los oscurecemos por CSS
     para el look GTA sin depender de un proveedor con API key */
  #map .leaflet-tile-pane{
    filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.05) saturate(0.6);
  }
  .leaflet-control-attribution{
    font-size:8px !important;
    background:rgba(0,0,0,.4) !important;
    color:#999 !important;
  }
  .leaflet-control-attribution a{ color:#bbb !important; }

  #player{
    position:absolute; left:50%; top:50%;
    width:0; height:0;
    z-index:15;
    pointer-events:none;
  }
  #playerArrow{
    position:absolute; left:-13px; top:-13px;
    width:26px; height:26px;
  }
  #compassLayer{
    position:absolute; inset:5px;
    border-radius:50%;
    transform-origin:50% 50%;
    pointer-events:none;
    z-index:18;
  }
  .tick{
    position:absolute; left:50%; top:50%;
    width:2px; height:165px;
    margin-left:-1px; margin-top:-165px;
    transform-origin:50% 165px;
  }
  .tick span{
    position:absolute; top:0; left:50%;
    transform:translateX(-50%);
    color:#fff; font-size:13px; font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
  }
  .tick.minor{ width:2px; height:6px; background:rgba(255,255,255,.5); margin-top:0; top:0; }

  #hud{
    position:absolute; left:50%; bottom:-6px;
    transform:translateX(-50%);
    background:#000; color:#fff;
    padding:4px 14px; border-radius:10px;
    font-size:12px; font-weight:600;
    border:2px solid rgba(255,255,255,.4);
    white-space:nowrap;
    z-index:25;
  }
  #hud .stale{ color:#ff5470; }

  #stars{
    position:absolute; left:50%; top:-6px;
    transform:translateX(-50%);
    display:flex; gap:2px;
    z-index:25;
  }
  #stars svg{ width:16px; height:16px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="clip">
    <div id="mapRotor"><div id="map"></div></div>

    <div id="compassLayer">
      <div class="tick" id="tickN"><span>N</span></div>
      <div class="tick" id="tickE"><span>E</span></div>
      <div class="tick" id="tickS"><span>S</span></div>
      <div class="tick" id="tickO"><span>O</span></div>
    </div>

    <div id="player">
      <svg id="playerArrow" viewBox="0 0 26 26">
        <circle cx="13" cy="13" r="12" fill="rgba(94,225,200,.18)"/>
        <polygon points="13,3 20,21 13,17 6,21" fill="#ff2d55" stroke="#fff" stroke-width="1.4"/>
      </svg>
    </div>
  </div>
  <div id="ring"></div>
  <div id="hud">esperando señal…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  // ======================= CONFIGURA ESTO =======================
  // Debe ser IDÉNTICO al firebaseConfig de tracker.html
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
    projectId: "TU_PROYECTO",
  };
  const params = new URLSearchParams(location.search);
  const DEVICE_ID = params.get("id") || "principal";
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const locRef = ref(db, "locations/" + DEVICE_ID);

  const map = L.map("map", {
    zoomControl:false, attributionControl:true,
    dragging:false, scrollWheelZoom:false, doubleClickZoom:false,
    boxZoom:false, keyboard:false, touchZoom:false, tap:false,
  }).setView([4.142, -73.626], 17); // Villavicencio por defecto hasta recibir GPS real

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    subdomains: "abc",
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);

  const trail = L.polyline([], { color:"#ff2d55", weight:3, opacity:.7 }).addTo(map);
  const trailPoints = [];
  const MAX_TRAIL = 60;

  const mapRotor = document.getElementById("mapRotor");
  const compassLayer = document.getElementById("compassLayer");
  const hud = document.getElementById("hud");

  const ticks = {
    N: document.querySelector("#tickN span"),
    E: document.querySelector("#tickE span"),
    S: document.querySelector("#tickS span"),
    O: document.querySelector("#tickO span"),
  };
  document.getElementById("tickN").style.transform = "rotate(0deg)";
  document.getElementById("tickE").style.transform = "rotate(90deg)";
  document.getElementById("tickS").style.transform = "rotate(180deg)";
  document.getElementById("tickO").style.transform = "rotate(270deg)";
  // counter-rotate letters so they stay upright (fixed below on update)

  let lastTs = 0;
  let firstFix = true;

  function updateStaleness(){
    const ageMs = Date.now() - lastTs;
    if (!lastTs) return;
    if (ageMs > 15000) {
      hud.innerHTML = '<span class="stale">señal perdida</span>';
    }
  }
  setInterval(updateStaleness, 3000);

  // ---- Interpolación suave entre fixes de GPS ----
  // En vez de saltar de golpe cada vez que llega una posición nueva,
  // animamos continuamente desde la última posición conocida hacia la
  // nueva, durante el mismo intervalo de tiempo que tardó en llegar.
  let animFrom = null;      // {lat,lng,heading}
  let animTo = null;        // {lat,lng,heading}
  let animStart = 0;
  let animDuration = 1000;  // ms, se ajusta según el intervalo real entre fixes
  let lastFixTime = 0;
  let rafId = null;

  function shortestAngleDelta(a, b){
    let d = (b - a) % 360;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  }

  function applyFrame(lat, lng, heading){
    map.setView([lat, lng], map.getZoom(), { animate:false });
    mapRotor.style.transform = `rotate(${-heading}deg)`;
    compassLayer.style.transform = `rotate(${-heading}deg)`;
    ["N","E","S","O"].forEach(dir => {
      ticks[dir].style.transform = `rotate(${heading}deg)`;
    });
  }

  function tick(now){
    if (!animFrom || !animTo) return;
    const t = Math.min(1, (now - animStart) / animDuration);
    const ease = t; // lineal: el GPS ya viene "atrasado", no hace falta easing extra
    const lat = animFrom.lat + (animTo.lat - animFrom.lat) * ease;
    const lng = animFrom.lng + (animTo.lng - animFrom.lng) * ease;
    const heading = animFrom.heading + shortestAngleDelta(animFrom.heading, animTo.heading) * ease;
    applyFrame(lat, lng, heading);
    if (t < 1) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
    }
  }

  function handleUpdate(d){
    if (!d || !d.lat) return;
    lastTs = d.ts || Date.now();

    const now = performance.now();
    const rawInterval = lastFixTime ? (Date.now() - lastFixTime) : 1000;
    // clamp: nunca animamos por menos de 300ms ni más de 4s, así un GPS
    // lento no se siente "congelado" y uno rápido no se ve tembloroso
    animDuration = Math.max(300, Math.min(4000, rawInterval));
    lastFixTime = Date.now();

    const currentLat = animTo ? animTo.lat : d.lat;
    const currentLng = animTo ? animTo.lng : d.lng;
    const currentHeading = animTo ? animTo.heading : (d.heading || 0);

    animFrom = { lat: currentLat, lng: currentLng, heading: currentHeading };
    animTo = { lat: d.lat, lng: d.lng, heading: d.heading || 0 };
    animStart = now;

    if (firstFix) {
      map.setZoom(18);
      applyFrame(d.lat, d.lng, d.heading || 0);
      firstFix = false;
    }

    trailPoints.push([d.lat, d.lng]);
    if (trailPoints.length > MAX_TRAIL) trailPoints.shift();
    trail.setLatLngs(trailPoints);

    if (rafId === null) rafId = requestAnimationFrame(tick);

    const kmh = d.speed ? (d.speed * 3.6).toFixed(0) : 0;
    hud.textContent = kmh + " km/h";
  }

  onValue(locRef, (snap) => {
    handleUpdate(snap.val());
  });
</script>
</body>
</html>
